
spring.datasource.url=jdbc:sqlserver://localhost:1435;databaseName=UniversityManagement;encrypt=true;trustServerCertificate=true
spring.datasource.username=chuong
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:n4-init.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true