<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <!-- AdminLTE: giải nén vào src/main/resources/static/adminlte -->
    <link rel="stylesheet" href="/adminlte/admin-lte-v4.9.1/dist/css/adminlte.css">
    <!-- Nếu CHƯA cài AdminLTE, bỏ comment dòng dưới để trang vẫn có giao diện Bootstrap -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" /> -->
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
            <h3 class="m-0">Danh sách sinh viên</h3>
            <button type="button" id="btnAdd" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Thêm sinh viên
            </button>
        </div>

        <!-- Tìm kiếm -->
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control"
                   placeholder="Tìm theo mã sinh viên, họ tên, email, số điện thoại...">
        </div>
    </div>

    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th style="width: 15%;">Mã sinh viên</th>
                <th style="width: 20%;">Họ và tên</th>
                <th style="width: 20%;">Email</th>
                <th style="width: 20%;">Số điện thoại</th>
                <th style="width: 10%;">Lớp</th>
                <th style="width: 20%;" class="text-end">Hành động</th>
            </tr>
        </thead>

        <tbody id="studentTableBody">
            <tr>
                <td colspan="6">
                    Đang tải dữ liệu...
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Modal dùng chung cho Thêm / Sửa / Xem -->
    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="studentForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Thêm sinh viên</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="studentId">
                        <div class="mb-3">
                            <label for="studentCode" class="form-label">Mã sinh viên</label>
                            <input type="text" id="studentCode" class="form-control" maxlength="50" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và tên</label>
                            <input type="text" id="fullName" class="form-control" maxlength="255" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" maxlength="255" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="text" id="phone" class="form-control" maxlength="255">
                        </div>
                        <div class="mb-3">
                            <label for="className" class="form-label">Lớp</label>
                            <input type="text" id="className" class="form-control" maxlength="255">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" id="btnSave" class="btn btn-primary">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS cần cho modal (AdminLTE chỉ cung cấp CSS/JS riêng của nó) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/student.js"></script>
</body>
</html>
