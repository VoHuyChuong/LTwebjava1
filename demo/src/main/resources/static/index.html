<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="bi bi-people-fill me-2"></i>Quản Lý Sinh Viên</h2>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i> Thêm Sinh Viên</button>
    </div>

    <!-- Thanh tìm kiếm -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Tìm theo Mã SV, Họ tên, Email, SĐT..." onkeyup="fetchStudents()">
            </div>
        </div>
    </div>

    <!-- Bảng dữ liệu -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã SV</th>
                            <th>Họ và Tên</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Lớp</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <!-- Dữ liệu JS sẽ đổ vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Thêm/Sửa Sinh Viên -->
<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thêm Sinh Viên</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    <div class="mb-3">
                        <label class="form-label">Mã SV</label>
                        <input type="text" id="studentCode" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Họ và Tên</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" id="phone" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lớp</label>
                        <input type="text" id="className" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Lưu thông tin</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = '/api/students';
    const modal = new bootstrap.Modal(document.getElementById('studentModal'));

    document.addEventListener('DOMContentLoaded', fetchStudents);

    // Lấy danh sách sinh viên
    async function fetchStudents() {
        const keyword = document.getElementById('searchInput').value;
        const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;
        const res = await fetch(url);
        const data = await res.json();
        
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = data.map(s => `
            <tr>
                <td class="fw-bold">${s.studentCode || ''}</td>
                <td>${s.fullName || ''}</td>
                <td>${s.email || ''}</td>
                <td>${s.phone || ''}</td>
                <td><span class="badge bg-secondary">${s.className || 'N/A'}</span></td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editStudent('${s.id}')"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${s.id}')"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    // Mở modal thêm mới
    function openModal() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('modalTitle').innerText = 'Thêm Sinh Viên';
        modal.show();
    }

    // Sửa sinh viên
    async function editStudent(id) {
        const res = await fetch(`${API_URL}/${id}`);
        const s = await res.json();
        document.getElementById('studentId').value = s.id;
        document.getElementById('studentCode').value = s.studentCode;
        document.getElementById('fullName').value = s.fullName;
        document.getElementById('email').value = s.email;
        document.getElementById('phone').value = s.phone || '';
        document.getElementById('className').value = s.className || '';
        document.getElementById('modalTitle').innerText = 'Cập nhật thông tin';
        modal.show();
    }

    // Lưu dữ liệu (Thêm hoặc Sửa)
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('studentId').value;
        const student = {
            studentCode: document.getElementById('studentCode').value,
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            className: document.getElementById('className').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        });

        modal.hide();
        fetchStudents();
    });

    // Xóa sinh viên
    async function deleteStudent(id) {
        if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchStudents();
        }
    }
</script>
</body>
</html>
